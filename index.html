<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>W&T Varejista | Acesso</title>

  <!-- Configurações PWA do seu aplicativo antigo que funcionam -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="application-name" content="W&T Varejista">
  <meta name="apple-mobile-web-app-title" content="W&T Varejista">
  <meta name="theme-color" content="#0b4a3a">

  <!-- Links para o visual funcionar (Tailwind CSS) -->
  <script src="https://jsdelivr.net"></script>
  
  <style>
    body { background-color: #0b4a3a; color: #ffffff; }
  </style>
</head>
<body class="flex min-h-screen flex-col items-center justify-center p-4">

  <!-- Tela de Login Estruturada com base no seu app atual -->
  <main class="w-full max-w-md mx-auto">
    <div class="flex flex-col items-center mb-8">
      <!-- Logo do seu App -->
      <h2 class="text-3xl font-bold tracking-wider text-white">W&T VAREJISTA</h2>
      <p class="text-sm text-emerald-200 mt-1">Plataforma de Holding</p>
    </div>

    <!-- Caixa Branca de Login -->
    <div class="bg-white rounded-2xl p-6 shadow-xl border border-emerald-800 text-slate-900">
      <div class="mb-6 text-center">
        <h1 class="text-xl font-semibold">Seja bem-vindo à W&T</h1>
        <p class="text-sm text-slate-500 mt-1">Acesso ao catálogo, caixa de balcão e gestão.</p>
      </div>

      <!-- Botões de Acesso -->
      <div class="space-y-4">
        <button onclick="alert('Indo para o catálogo...')" class="w-full bg-emerald-700 text-white font-medium py-3 px-4 rounded-xl hover:bg-emerald-800 transition shadow-sm cursor-pointer">
          Acessar como Visitante / Catálogo
        </button>
        
        <button onclick="alert('Abrindo tela de login de Membro...')" class="w-full bg-slate-100 text-slate-800 font-medium py-3 px-4 rounded-xl border border-slate-200 hover:bg-slate-200 transition cursor-pointer">
          Já sou Cliente Fixo (Login)
        </button>
      </div>
    </div>
  </main>

</body>
</html>
